<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esports: Admin</title>
    <link rel="stylesheet" href="style.css">
    <script src="./index.js" type="module" defer></script>
</head>
<body>
    <section class="dashboard">
        <h2 class="dashboard__title">О турнире</h2>

        <div class="dashboard__statisctics">
            <div class="dashboard__statisctics__teams">Общее кол-во команд:</div>
            <div class="dashboard__statisctics__allMatches">Общее кол-во матчей:</div>
            <div class="dashboard__statisctics__finishedMatches">Кол-во законченных матчей:</div>
            <div class="dashboard__statisctics__futureMatches">Кол-во будущих матчей:</div>
        </div>

        <div class="dashboard__futureMatches"></div>

    </section>

    <section class="team">
        <h2>Создать команду</h2>

        <form action="" class="team__createTeam">
            <input type="text" placeholder="Введите название команды">
            <input type="text" placeholder="Введите страну команды">
            <button class="button team__createTeam__button">Создать команду</button>
        </form>

        <h2>Фильтры</h2>

        <div class="team__searchCountry">
            <div class="team__searchCountry">По странам</div>
            <select></select>
            <button class="button team__searchCountry__button">Применить</button>
        </div>

        <div class="team__searchDifferent">
            <div class="team__searchDifferent">Различное</div>
            <select>
                <option value="a-z">С начала алфавита</option>
                <option value="z-a">С конца алфавита</option>
                <option value="pointsful">С начала таблицы (по очкам)</option>
                <option value="pointsless">С конца таблицы (по очкам)</option>
            </select>
            <button class="button team__searchDifferent__button">Применить</button>
        </div>
    </section>

    <section class="matches">
        <h2>Матчи</h2>

        <div class="matches__form">
            <form action="">
                <input type="text" placeholder="Команда 1">
                <input type="text" placeholder="Команда 2">
                <button class="button matches__form__button">Создать матч</button>
            </form>
        </div>

        <div class="matches__newMatches"></div>

        <div class="matches__oldMatches"></div>
    </section>
</body>
</html>
